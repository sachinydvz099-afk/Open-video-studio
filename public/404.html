<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting to Open Video Studio...</title>
    <script>
      // Single Page Application redirect for GitHub Pages
      // Encodes path and query parameters into hash route so index.html can load it
      var pathSegmentsToKeep = 1;
      var l = window.location;
      var repoName = l.pathname.split('/')[1] || '';
      var path = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
      var redirectUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        (repoName ? '/' + repoName : '') + '/#/' + path + (l.search ? l.search : '') + l.hash;
      window.location.replace(redirectUrl);
    </script>
  </head>
  <body style="background-color: #07080b; color: #f59e0b; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <p>Redirecting to Open Video Studio...</p>
  </body>
</html>
